# Лимиты ресурсов проекта. Машина WSL общая с сервером toraX (воркер на GPU) и с `ml`.
# Общие ресурсы VM: 40 ГБ ОЗУ, 8 ГБ swap, 24 потока CPU, RTX 5070 Ti 16 ГБ.

cpu:
  n_jobs: 8                 # параллельных процессов joblib (из 24 потоков)
  threads_per_process: 2    # потоков BLAS/torch на процесс: 8 × 2 = 16 потоков максимум
  nice: 10                  # пониженный приоритет: соседи получают CPU первыми

memory:
  max_gb: 16                # потолок для tools/run_limited.sh (systemd-run MemoryMax)

gpu:
  memory_fraction: 0.5      # не больше 8 ГБ видеопамяти на процесс

ports:                      # занятые порты: 22, 80, 443, 5432, 8000, 8080, 8443 (сервер), 2222 (ml)
  jupyter: 8890
  tensorboard: 6010
  mlflow: 5010
