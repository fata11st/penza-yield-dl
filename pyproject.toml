[project]
name = "penza-yield"
version = "0.1.0"
description = "Прогнозирование урожайности Пензенской области методами глубокого обучения"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch==2.14.1",
    "numpy>=2.0",
    "pandas>=2.2",
    "openpyxl>=3.1",
    "scikit-learn>=1.5",
    "scipy>=1.13",
    "statsmodels>=0.14",
    "joblib>=1.4",
    "pyyaml>=6.0",
    "matplotlib>=3.9",
    "tqdm>=4.66",
    "chronos-forecasting>=2.3.2",   # E07: Chronos-2, Apache-2.0
    "tabpfn>=9.2",                  # E06: веса закрыты лицензией, нужен TABPFN_TOKEN
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "ipykernel>=6.29"]

# PyTorch — сборка под CUDA 13.0 (RTX 5070 Ti, sm_120). cu128 выходил только до torch 2.11, cu126 и старше
# Blackwell не поддерживают. Проверено 29.10.2026: torch 2.14.1+cu130, драйвер Windows 617.42.
[tool.uv.sources]
torch = [{ index = "pytorch-cu130" }]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/penza_yield"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
